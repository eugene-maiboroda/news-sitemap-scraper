spring.application.name=news-sitemap-scraper
spring.profiles.default=dev
spring.main.web-application-type=none

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.level.root=INFO
logging.level.com.article=DEBUG

collector.steps.collect-links=${COLLECTOR_COLLECT_LINKS:true}
collector.steps.parse-pages=${COLLECTOR_PARSE_PAGES:true}
collector.steps.download-images=${COLLECTOR_DOWNLOAD_IMAGES:true}
collector.steps.export-json=${COLLECTOR_EXPORT_JSON:true}

collector.parse-batch-size=${COLLECTOR_PARSE_BATCH_SIZE:10}
collector.parse-threads=${COLLECTOR_PARSE_THREADS:10}
collector.image-threads=${COLLECTOR_IMAGE_THREADS:4}

collector.delivery-limit=${COLLECTOR_DELIVERY_LIMIT:5000}

collector.export-dir=${COLLECTOR_EXPORT_DIR:results/json}
collector.images-dir=${COLLECTOR_IMAGES_DIR:results/images}
