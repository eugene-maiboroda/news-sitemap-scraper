spring.profiles.default=hunter

spring.main.web-application-type=none

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.level.root=INFO
logging.level.com.article=INFO
logging.level.com.article.adapter.video=INFO

collector.discovery-source=MENU
# For SITEMAP, start at a sitemap index or directly at a leaf URL set.
# An index follows its child sitemaps. A leaf URL set imports only its own URLs.
# collector.sitemap-urls[0]=https://example.com/articles-sitemap.xml

steps.discover-links.enabled=false
steps.discover-links.batch-size=5000

steps.parse-pages.enabled=false
steps.parse-pages.source=HTTP
steps.parse-pages.batch-size=5000

steps.download-images.enabled=false
steps.download-images.batch-size=5000
steps.download-videos.enabled=false
steps.download-videos.batch-size=10

steps.export-json.enabled=false
steps.export-json.batch-size=5000

steps.extract-authors.enabled=false

browser.headless=true
browser.timeout-ms=30000
browser.enabled=false

video.timeout-ms=300
video.yt-dlp-command=yt-dlp
collector.parse-threads=15
