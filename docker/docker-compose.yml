version: "3.9"

services:
  si-postgres-hunter:
    image: postgres:15
    environment:
      POSTGRES_DB: hunter_articles
      POSTGRES_USER: eyal
      POSTGRES_PASSWORD: eyal_hunter
    ports:
      - "5441:5432"
    volumes:
       - si_article_hunter_pgdata:/var/lib/postgresql/data

volumes:
  si_article_hunter_pgdata: