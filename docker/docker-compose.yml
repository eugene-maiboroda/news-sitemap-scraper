version: "3.9"

services:
  si-postgres-rifleman:
    image: postgres:15
    environment:
      POSTGRES_DB: rifleman_articles
      POSTGRES_USER: eyal
      POSTGRES_PASSWORD: eyal_rifleman
    ports:
      - "5442:5432"
    volumes:
       - si_article_rifleman_pgdata:/var/lib/postgresql/data

volumes:
  si_article_rifleman_pgdata: