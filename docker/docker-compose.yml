version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: si-postgres
    environment:
      POSTGRES_DB: si_articles
      POSTGRES_USER: si_user
      POSTGRES_PASSWORD: si_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: